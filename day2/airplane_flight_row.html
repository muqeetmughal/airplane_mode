<div>
	<div class="card mb-3 shadow-sm border-0 hover-shadow">
		<div class="card-body">
			<div class="d-flex justify-content-between align-items-start">
				<div>
					<h5 class="card-title mb-2">
						<a href="{{ doc.route }}" class="text-decoration-none">{{ doc.airplane }}</a>
					</h5>
					<p class="card-text text-muted mb-3">
						<strong class="text-dark">{{ doc.source_airport_code }} → {{ doc.destination_airport_code }}</strong>
					</p>
				</div>
				<span class="badge bg-default">{{ frappe.utils.format_duration(doc.duration) }}</span>
			</div>
			<div class="d-flex justify-content-between align-items-center">
				<small class="text-muted">
					<i class="icon-calendar"></i> {{frappe.utils.format_date(doc.date_of_departure, "d MMMM, YYYY")}}
				</small>
				<small class="text-muted">
					<i class="icon-clock"></i> {{ doc.time_of_departure }}
				</small>
			</div>
			<a  class="btn btn-primary" href="{{ doc.route }}">View Flight</a>
		</div>
	</div>
</div>
<!-- this is a sample default list template -->
